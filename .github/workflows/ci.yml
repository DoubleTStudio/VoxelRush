name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_PROJECT: unity

jobs:
  domain-tests:
    name: Domain tests (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: tools/test.sh domain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domain-test-results
          path: artifacts/test-results/

  # Unity jobs need license secrets; skip them visibly instead of failing or faking green.
  unity-license:
    name: Unity license available
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -n "$UNITY_LICENSE" || -n "$UNITY_SERIAL" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE/UNITY_SERIAL not configured; Unity test and build jobs are skipped."
          fi

  unity-tests:
    name: Unity EditMode + PlayMode
    needs: [domain-tests, unity-license]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-tests-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-tests-
      - uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          testMode: all
          artifactsPath: artifacts/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-test-results
          path: artifacts/test-results/

  build-server:
    name: Linux dedicated server + smoke
    needs: unity-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-server-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-server-
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          targetPlatform: StandaloneLinux64
          buildMethod: VoxelRush.Editor.BuildEntryPoints.BuildLinuxServer
          customParameters: -buildOutput Builds/Server/VoxelRushServer.x86_64
          manualExit: true
      # Native x86-64 here, so this also covers the Mono runtime that cannot run under Rosetta locally.
      - run: tools/smoke-server.sh unity/Builds/Server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-linux64
          path: |
            unity/Builds/Server/
            !unity/Builds/Server/*_DoNotShip/
          retention-days: 7

  build-android:
    name: Android APK
    needs: unity-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Android editor image plus Gradle cache exceed the default runner disk.
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-android-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-android-
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          targetPlatform: Android
          buildMethod: VoxelRush.Editor.BuildEntryPoints.BuildAndroid
          customParameters: -buildOutput Builds/Android/VoxelRush.apk
          manualExit: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: unity/Builds/Android/VoxelRush.apk
          retention-days: 7

  # iOS runs on main/manual only: the Xcode project is ~1 GB and macOS minutes are expensive.
  build-ios-project:
    name: iOS Xcode project
    needs: unity-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-ios-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-ios-
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT }}
          targetPlatform: iOS
          buildMethod: VoxelRush.Editor.BuildEntryPoints.BuildIos
          customParameters: -buildOutput Builds/iOS/Xcode
          manualExit: true
      # Tar keeps executable bits and symlinks that artifact upload would drop.
      - run: tar -C unity/Builds/iOS -czf ios-xcode.tgz Xcode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcode-project
          path: ios-xcode.tgz
          retention-days: 1

  compile-ios:
    name: iOS compile (unsigned)
    needs: build-ios-project
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-project
      - run: tar -xzf ios-xcode.tgz
      - run: >
          xcodebuild -project Xcode/Unity-iPhone.xcodeproj -scheme Unity-iPhone
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
