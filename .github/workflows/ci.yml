name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain tests (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: tools/test.sh domain
      # VR-032 DoD: SIGKILL the journal writer repeatedly; no acknowledged edit may be lost.
      - name: Journal crash test
        run: tools/crash-test.sh 15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domain-test-results
          path: |
            artifacts/test-results/
            artifacts/crash-test/*.txt

  # Unity jobs need license secrets; skip them visibly instead of failing or faking green.
  unity-license:
    name: Unity license available
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_EMAIL/UNITY_PASSWORD not configured; Unity test and build jobs are skipped."
          fi

  # One job so a run holds a single Personal license activation; the lock serialises runs across PRs.
  unity:
    name: Unity tests + builds
    needs: [domain-tests, unity-license]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: unity-personal-license
      cancel-in-progress: false
    env:
      UNITY_TEST_BUILD_TARGET: ""
      BUILD_IOS: ${{ github.event_name != 'pull_request' }}
    steps:
      # Editor + modules + Library + builds need ~25 GB; fail fast on a smaller runner.
      - name: Check free disk space
        run: |
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${free_gb} GB"
          if (( free_gb < 40 )); then
            echo "::error::Only ${free_gb} GB free; the Unity job needs at least 40 GB."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-${{ runner.os }}-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-${{ runner.os }}-
      # Hub 3.2x debs install to /usr/lib/unityhub; unity-setup v2.6.0 hard-codes /opt/unityhub (incl. its wrapper script).
      - name: Map legacy Unity Hub path
        run: sudo ln -sfn /usr/lib/unityhub /opt/unityhub
      - id: unity-setup
        uses: RageAgainstThePixel/unity-setup@3da1aae07f5635ff478d3ad7f29782b3aea88258 # v2.6.0
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          build-targets: ${{ env.BUILD_IOS == 'true' && 'StandaloneLinux64, Android, iOS' || 'StandaloneLinux64, Android' }}
          modules: linux-server
          hub-version: 3.22.3
      # Post step returns the seat, so Personal activations are not leaked between runs.
      - uses: RageAgainstThePixel/activate-unity-license@e73ff1f81db81a2595f86642123ce2b73b9a9258 # v2.2.2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: EditMode tests
        run: tools/test.sh editmode
      - name: PlayMode tests
        run: tools/test.sh playmode

      - name: Build Linux dedicated server
        run: tools/build.sh server
      # Native x86-64 here, so this also covers the Mono runtime that cannot run under Rosetta locally.
      - name: Server smoke test
        run: tools/smoke-server.sh build/server

      # Development build: latency simulation and cheat mode are dev-only.
      - name: Build Linux headless bot
        run: tools/build.sh bot-linux --development
      # VR-002 DoD: server image + two headless Linux bots join; with -maxPlayers 1 the second is refused.
      - name: Join test (Docker server image + 2 bots)
        run: tools/smoke-join.sh docker
      # VR-012 DoD: two predicted cars at 100 ms RTT on the authoritative server; a speed hack is rejected.
      - name: Drive test (2 predicted cars, 100 ms RTT, speed hack)
        run: tools/smoke-drive.sh docker
      # VR-033 DoD: late-join chunk hashes match the server's, and survive a server restart (journal recovery).
      - name: World sync test (builders, late join, restart)
        run: tools/smoke-world.sh docker
      # VR-062 DoD: 8-player race flow (lobby auto-start, validated gates, reconnect, identical results on every client).
      # A 2-core hosted runner can't run the server plus 8 Unity bots at 30 Hz (ticks stall for seconds); 8-player
      # load is covered by the load test's lighter bots.
      - name: Race flow test (4 racers)
        env:
          RACE_BOTS: 4
        run: tools/smoke-race.sh docker
      # VR-013: 8-player load; main/manual only (8 bot processes on the runner).
      - name: Load test (8 bots, 30 Hz tick metrics)
        if: env.BUILD_IOS == 'true'
        run: tools/load-test.sh docker 8 30

      - name: Build Android APK
        run: tools/build.sh android

      - name: Build iOS Xcode project
        if: env.BUILD_IOS == 'true'
        run: tools/build.sh ios
      # Tar keeps executable bits and symlinks that artifact upload would drop.
      - name: Package iOS Xcode project
        if: env.BUILD_IOS == 'true'
        run: tar -C build/ios -czf ios-xcode.tgz Xcode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-test-results-and-logs
          path: |
            artifacts/test-results/
            artifacts/build-logs/
            artifacts/smoke-join/
            artifacts/smoke-drive/
            artifacts/smoke-world/*.log
            artifacts/smoke-world/*.hashes
            artifacts/smoke-race/*.log
            artifacts/load/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-linux64
          path: |
            build/server/
            !build/server/*_DoNotShip/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: build/android/VoxelRush.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD_IOS == 'true'
        with:
          name: ios-xcode-project
          path: ios-xcode.tgz
          retention-days: 1

  # iOS runs on main/manual only: the Xcode project is ~1 GB and macOS minutes are expensive.
  compile-ios:
    name: iOS compile (unsigned)
    needs: unity
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-project
      - run: tar -xzf ios-xcode.tgz
      - run: >
          xcodebuild -project Xcode/Unity-iPhone.xcodeproj -scheme Unity-iPhone
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
