name: CI

on:
  pull_request:
    # labeled: adding "full-ci" to a PR runs the full suite.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # CI-002: a merge must not cancel main's full suite mid-run; the newest push waits instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain tests (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # QUALITY_GATES "no leaked secrets": scan the full history, findings redacted.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: tools/test.sh domain
      # VR-032 DoD: SIGKILL the journal writer repeatedly; no acknowledged edit may be lost.
      - name: Journal crash test
        run: tools/crash-test.sh 15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domain-test-results
          path: |
            artifacts/test-results/
            artifacts/crash-test/*.txt

  # VR-080: API auth/security tests against real PostgreSQL and an S3-compatible store (Testcontainers).
  api-tests:
    name: API tests (.NET + Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test backend/VoxelRush.Api.Tests --logger "trx;LogFileName=api.trx" --results-directory artifacts/test-results
      # ALLOC-001: host agent against a fake container runtime (no Docker needed).
      - run: dotnet test backend/VoxelRush.HostAgent.Tests --logger "trx;LogFileName=host-agent.trx" --results-directory artifacts/test-results
      - run: tools/build-api.sh
      - run: tools/build-host-agent.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-test-results
          path: artifacts/test-results/

  # CI-001: PRs that only touch the backend or docs skip the Unity job (and its single-license queue).
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      unity: ${{ steps.diff.outputs.unity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]] || git diff --name-only "$BASE"...HEAD | grep -qvE '^(backend/|docs/|tasks/|docker/api/|docker/host-agent/|docker/compose\.dev\.yaml$|tools/dev-online\.sh$)|\.md$'; then
            echo "unity=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend/docs-only change: Unity tests and builds skipped (main runs everything)."
          fi

  # Unity jobs need license secrets; skip them visibly instead of failing or faking green.
  unity-license:
    name: Unity license available
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_EMAIL/UNITY_PASSWORD not configured; Unity test and build jobs are skipped."
          fi

  # One job so a run holds a single Personal license activation; the lock serialises runs across PRs.
  unity:
    name: Unity tests + builds
    needs: [domain-tests, unity-license, changes]
    if: needs.unity-license.outputs.available == 'true' && needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      ios: ${{ steps.ios-package.outcome }}
    concurrency:
      group: unity-personal-license
      cancel-in-progress: false
    # packages:write only matters on main (image publish); PR tokens stay read-only.
    permissions:
      contents: read
      packages: write
    env:
      # Player, not Server: a cached Library can be left on the Dedicated Server subtarget, which compiles out Presentation.
      UNITY_TEST_BUILD_TARGET: Linux64
      BUILD_IOS: ${{ github.event_name != 'pull_request' }}
      # CI-001: PRs get the fast gate (unit tests, builds, core end-to-end tests); main, manual runs and PRs labelled
      # "full-ci" add Android, the long end-to-end suites, loss/stress/load and iOS.
      FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      # Editor + modules + Library + builds need ~25 GB; fail fast on a smaller runner.
      - name: Check free disk space
        run: |
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${free_gb} GB"
          if (( free_gb < 40 )); then
            echo "::error::Only ${free_gb} GB free; the Unity job needs at least 40 GB."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Library
          key: library-${{ runner.os }}-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-${{ runner.os }}-
      # Hub 3.2x debs install to /usr/lib/unityhub; unity-setup v2.6.0 hard-codes /opt/unityhub (incl. its wrapper script).
      - name: Map legacy Unity Hub path
        run: sudo ln -sfn /usr/lib/unityhub /opt/unityhub
      - id: unity-setup
        uses: RageAgainstThePixel/unity-setup@3da1aae07f5635ff478d3ad7f29782b3aea88258 # v2.6.0
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          # The Android module (SDK/NDK/JDK) is most of the install time; the fast gate doesn't build Android.
          build-targets: ${{ env.BUILD_IOS == 'true' && 'StandaloneLinux64, Android, iOS' || env.FULL == 'true' && 'StandaloneLinux64, Android' || 'StandaloneLinux64' }}
          modules: linux-server
          hub-version: 3.22.3
      # Post step returns the seat, so Personal activations are not leaked between runs.
      - uses: RageAgainstThePixel/activate-unity-license@e73ff1f81db81a2595f86642123ce2b73b9a9258 # v2.2.2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: EditMode tests
        run: tools/test.sh editmode
      - name: PlayMode tests
        run: tools/test.sh playmode

      - name: Build Linux dedicated server
        run: tools/build.sh server
      # Native x86-64 here, so this also covers the Mono runtime that cannot run under Rosetta locally.
      - name: Server smoke test
        run: tools/smoke-server.sh build/server

      # Development build: latency simulation and cheat mode are dev-only.
      - name: Build Linux headless bot
        id: bot-build
        run: tools/build.sh bot-linux --development
      # CI-002: end-to-end tests run even after an earlier one fails, so one run reports every regression.
      # VR-002 DoD: server image + two headless Linux bots join; with -maxPlayers 1 the second is refused.
      - name: Join test (Docker server image + 2 bots)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        run: tools/smoke-join.sh docker
      # VR-012 DoD: two predicted cars at 100 ms RTT on the authoritative server; a speed hack is rejected.
      - name: Drive test (2 predicted cars, 100 ms RTT, speed hack)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        run: tools/smoke-drive.sh docker
      # VR-033 DoD: late-join chunk hashes match the server's, and survive a server restart (journal recovery).
      - name: World sync test (builders, late join, restart)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        run: tools/smoke-world.sh docker
      # VR-062 DoD: 8-player race flow (lobby auto-start, validated gates, reconnect, identical results on every client).
      # A 2-core hosted runner can't run the server plus 8 Unity bots at 30 Hz (ticks stall for seconds); 8-player
      # load is covered by the load test's lighter bots.
      - name: Race flow test (4 racers)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        env:
          RACE_BOTS: 4
        run: tools/smoke-race.sh docker
      # VR-080: API-issued join tickets admitted by a ticket-only server; replayed/forged/missing tickets refused.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        with:
          global-json-file: global.json
      - name: Auth flow test (API tickets + game server)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        run: tools/build-api.sh && tools/smoke-auth.sh docker
      # SAVE-006: validated race rewards granted once through the API; a linked second device sees them.
      - name: Progression flow test (rewards, cross-device, no double grant)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/smoke-progression.sh docker
      # SAVE-005: one server per world (lease), idle shutdown releases it, the saved world survives the handover.
      - name: World lease test (single writer, idle shutdown, handover)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/smoke-lease.sh docker
      # SAVE-009: database rebuilt from a dump, point-in-time restore, stale server disk rebuilt from storage.
      - name: Recovery drill (pg_dump restore, point-in-time world restore)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/recovery-drill.sh docker
      # SAVE-008: device chunk cache: unchanged chunks confirmed on rejoin, tampered entries fall back to the server.
      - name: Chunk cache test (rejoin confirmations, tamper fallback)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/smoke-cache.sh docker
      # VR-072 DoD: drive, world sync and race again with 2% packet loss inside Unity Transport; full runs only.
      - name: Loss test (2% transport loss)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/smoke-loss.sh docker 2
      # VR-082: 8 players build/cut/collapse while the server is SIGKILLed; no acknowledged edit may be lost. Full runs only.
      - name: Destruction stress (8 bots, server crash)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/stress-destruction.sh docker
      # VR-013: 8-player load; full runs only (8 bot processes on the runner).
      - name: Load test (8 bots, 30 Hz tick metrics)
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' && env.FULL == 'true' }}
        run: tools/load-test.sh docker 8 30

      # VR-081: rollback drill against the previous :main image, then publish server + API images to GHCR.
      - name: Rollback drill + publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish-images.sh
      # VR-081: alert conditions (docs/operations/MONITORING.md) on the smoke servers' logs.
      - name: Server log alert check
        if: ${{ !cancelled() && steps.bot-build.outcome == 'success' }}
        run: for log in artifacts/smoke-world/server1.log artifacts/smoke-race/server.log artifacts/smoke-auth/server.log; do tools/check-server-log.sh "$log"; done

      - name: Build Android APK
        id: android-build
        if: ${{ !cancelled() && env.FULL == 'true' }}
        run: tools/build.sh android

      - name: Build iOS Xcode project
        id: ios-build
        if: ${{ !cancelled() && env.BUILD_IOS == 'true' }}
        run: tools/build.sh ios
      # Tar keeps executable bits and symlinks that artifact upload would drop.
      - name: Package iOS Xcode project
        id: ios-package
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        run: tar -C build/ios -czf ios-xcode.tgz Xcode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-test-results-and-logs
          path: |
            artifacts/test-results/
            artifacts/build-logs/
            artifacts/smoke-join/
            artifacts/smoke-drive/
            artifacts/smoke-world/*.log
            artifacts/smoke-world/*.hashes
            artifacts/smoke-race/*.log
            artifacts/smoke-auth/*.log
            artifacts/smoke-progression/*.log
            artifacts/smoke-lease/*.log
            artifacts/recovery-drill/*.log
            artifacts/smoke-cache/*.log
            artifacts/rollback-drill/
            artifacts/stress-destruction/*.log
            artifacts/load/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-linux64
          path: |
            build/server/
            !build/server/*_DoNotShip/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        with:
          name: android-apk
          path: build/android/VoxelRush.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.ios-package.outcome == 'success' }}
        with:
          name: ios-xcode-project
          path: ios-xcode.tgz
          retention-days: 1

  # iOS runs on main/manual only: the Xcode project is ~1 GB and macOS minutes are expensive.
  compile-ios:
    name: iOS compile (unsigned)
    needs: unity
    # Runs when the Xcode project was packaged, even if an end-to-end test failed.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.unity.outputs.ios == 'success' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-project
      - run: tar -xzf ios-xcode.tgz
      - run: >
          xcodebuild -project Xcode/Unity-iPhone.xcodeproj -scheme Unity-iPhone
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
